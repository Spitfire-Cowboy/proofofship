name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  public-surface-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run tests
        run: |
          python -m pytest -q --cov=proofofship --cov=tools.public_repo_checks --cov-report=xml

      - name: CLI smoke
        run: |
          proofofship check-public-surface --json
          proofofship score examples/score.sample.json --json
          proofofship score examples/score.sample.json --handle example-builder --json
          proofofship receipts example-builder examples/score.sample.json --json

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
